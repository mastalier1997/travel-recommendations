name: Supabase keepalive

# Supabase free tier pauses a project after 7 days with no activity. That's tracked by
# real database writes, not GET/SELECT traffic through PostgREST — a read-only ping
# still gets logged but doesn't reset the clock. So this writes to the dedicated
# `keepalive` table (supabase/migrations/0004_keepalive.sql) using the service-role
# key, since that table has RLS enabled with zero policies. Daily cadence leaves
# headroom against the 7-day window even if a scheduled run gets delayed or skipped.
#
# The write is an upsert and the response is checked: a bare PATCH answers 204 even when
# it matches zero rows (e.g. the seed row is missing), which would make this job go green
# without ever touching the database.
on:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write to keepalive table
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          body=$(mktemp)
          curl --fail --silent --show-error \
               --retry 3 --retry-all-errors --retry-delay 15 --max-time 30 \
               -o "$body" -w 'HTTP %{http_code} in %{time_total}s\n' \
               -X POST \
               -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
               -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
               -H "Content-Type: application/json" \
               -H "Prefer: resolution=merge-duplicates,return=representation" \
               -d "{\"id\":1,\"pinged_at\":\"$(date -u +%FT%TZ)\"}" \
               "$SUPABASE_URL/rest/v1/keepalive?on_conflict=id"
          # Must echo back exactly the one row we wrote.
          if [ "$(jq 'length' "$body")" != "1" ]; then
            echo "::error::keepalive upsert returned no row — nothing was written"
            cat "$body"
            exit 1
          fi
          jq -r '"keepalive row now: \(.[0].pinged_at)"' "$body"
